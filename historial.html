<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial — Sales Training Diio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h2>Sales Training</h2>
        <p>Diio</p>
      </div>
      <nav>
        <a href="index.html" class="nav-link">📊 Nine-Box Grid</a>
        <a href="evaluacion.html" class="nav-link">📝 Nueva Evaluación</a>
        <a href="vendedores.html" class="nav-link">👥 Vendedores</a>
        <a href="historial.html" class="nav-link active">📁 Historial</a>
      </nav>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1>Historial de Evaluaciones</h1>
          <p>Registro completo de todas las evaluaciones del equipo</p>
        </div>
        <a href="evaluacion.html" class="btn btn-primary">+ Nueva Evaluación</a>
      </div>

      <!-- Filtros -->
      <div class="card" style="margin-bottom:16px;padding:16px">
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <div>
            <label style="font-size:11px;color:#64748b;display:block;margin-bottom:4px">VENDEDOR</label>
            <select id="filtro_vendedor" onchange="filtrarHistorial()" style="padding:6px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px">
              <option value="">Todos</option>
            </select>
          </div>
          <div>
            <label style="font-size:11px;color:#64748b;display:block;margin-bottom:4px">AÑO</label>
            <select id="filtro_anio" onchange="filtrarHistorial()" style="padding:6px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px">
              <option value="">Todos</option>
              <option value="2026">2026</option>
              <option value="2025">2025</option>
              <option value="2024">2024</option>
            </select>
          </div>
          <div>
            <label style="font-size:11px;color:#64748b;display:block;margin-bottom:4px">TIPO</label>
            <select id="filtro_tipo" onchange="filtrarHistorial()" style="padding:6px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px">
              <option value="">Todos</option>
              <option value="mensual">Mensual</option>
              <option value="trimestral">Trimestral</option>
              <option value="semestral">Semestral</option>
              <option value="anual">Anual</option>
            </select>
          </div>
          <div style="margin-left:auto;font-size:12px;color:#64748b" id="total_registros"></div>
        </div>
      </div>

      <!-- Tabla -->
      <div class="card" style="padding:0;overflow:hidden">
        <table style="width:100%;border-collapse:collapse">
          <thead>
            <tr style="background:#f8fafc;border-bottom:1px solid #e2e8f0">
              <th style="padding:12px 16px;text-align:left;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase">Vendedor</th>
              <th style="padding:12px 16px;text-align:left;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase">Periodo</th>
              <th style="padding:12px 16px;text-align:center;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase">Consultivo</th>
              <th style="padding:12px 16px;text-align:center;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase">Técnico</th>
              <th style="padding:12px 16px;text-align:center;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase">YTD</th>
              <th style="padding:12px 16px;text-align:left;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase">Cuadrante</th>
              <th style="padding:12px 16px;text-align:left;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase">Fecha</th>
              <th style="padding:12px 16px;text-align:center;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaHistorial">
            <tr><td colspan="8" style="padding:40px;text-align:center;color:#94a3b8">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    let todasEvaluaciones = []

    async function initHistorial() {
      await cargarDatos()

      // Llenar filtro vendedores
      const sel = document.getElementById('filtro_vendedor')
      state.vendedores.forEach(v => {
        const opt = document.createElement('option')
        opt.value = v.id
        opt.textContent = v.nombre
        sel.appendChild(opt)
      })

      // Cargar evaluaciones con join
      todasEvaluaciones = await supabaseGet(
        'evaluaciones?select=*,vendedor:vendedores(nombre,rol)&order=fecha_evaluacion.desc'
      )

      filtrarHistorial()
    }

    function filtrarHistorial() {
      const vendedor = document.getElementById('filtro_vendedor').value
      const anio = document.getElementById('filtro_anio').value
      const tipo = document.getElementById('filtro_tipo').value

      let filtradas = todasEvaluaciones
      if (vendedor) filtradas = filtradas.filter(e => e.vendedor_id === vendedor)
      if (anio) filtradas = filtradas.filter(e => e.anio == anio)
      if (tipo) filtradas = filtradas.filter(e => e.tipo_periodo === tipo)

      document.getElementById('total_registros').textContent = `${filtradas.length} evaluaciones`
      renderTabla(filtradas)
    }

    function renderTabla(evaluaciones) {
      const tbody = document.getElementById('tablaHistorial')

      if (evaluaciones.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="padding:40px;text-align:center;color:#94a3b8">No hay evaluaciones con esos filtros</td></tr>`
        return
      }

      tbody.innerHTML = evaluaciones.map((e, i) => {
        const cfg = e.cuadrante ? CUADRANTES[e.cuadrante] : null
        const rowBg = i % 2 === 0 ? 'white' : '#f8fafc'
        return `
          <tr style="background:${rowBg};border-bottom:1px solid #f1f5f9">
            <td style="padding:12px 16px">
              <p style="font-size:13px;font-weight:600;color:#1a2e4a">${e.vendedor?.nombre || '—'}</p>
              <p style="font-size:11px;color:#94a3b8">${e.vendedor?.rol || ''}</p>
            </td>
            <td style="padding:12px 16px">
              <p style="font-size:13px;font-weight:600;color:#1a2e4a">${e.periodo_label || e.periodo} ${e.anio}</p>
              <p style="font-size:11px;color:#94a3b8">${e.tipo_periodo || 'trimestral'}</p>
            </td>
            <td style="padding:12px 16px;text-align:center">
              <p style="font-size:16px;font-weight:700;color:${ejeColor(e.eje_consultivo)}">${e.puntaje_consultivo?.toFixed(0) || '—'}</p>
              <p style="font-size:11px;color:${ejeColor(e.eje_consultivo)}">${e.eje_consultivo || '—'}</p>
            </td>
            <td style="padding:12px 16px;text-align:center">
              <p style="font-size:16px;font-weight:700;color:${ejeColor(e.eje_tecnico)}">${e.nota_tecnica_raw?.toFixed(0) || '—'}</p>
              <p style="font-size:11px;color:${ejeColor(e.eje_tecnico)}">${e.eje_tecnico || '—'}</p>
            </td>
            <td style="padding:12px 16px;text-align:center">
              <p style="font-size:14px;font-weight:700;color:${e.performance_ytd >= 100 ? '#059669' : e.performance_ytd >= 70 ? '#d97706' : '#dc2626'}">${e.performance_ytd ? e.performance_ytd + '%' : '—'}</p>
            </td>
            <td style="padding:12px 16px">
              ${cfg ? `<span style="background:${cfg.colorBg};color:${cfg.colorText};padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600">${cfg.emoji} ${e.cuadrante}</span>` : '<span style="color:#94a3b8;font-size:12px">—</span>'}
            </td>
            <td style="padding:12px 16px">
              <p style="font-size:12px;color:#64748b">${e.fecha_evaluacion || '—'}</p>
            </td>
            <td style="padding:12px 16px;text-align:center">
              <button onclick="verEvaluacion('${e.id}')" style="background:none;border:1px solid #e2e8f0;border-radius:6px;padding:4px 10px;font-size:11px;color:#64748b;cursor:pointer">Ver</button>
            </td>
          </tr>
        `
      }).join('')
    }

    function verEvaluacion(id) {
      // Por ahora redirige al nine-box
      // En el futuro: modal con detalle completo
      window.location.href = 'index.html'
    }

    document.addEventListener('DOMContentLoaded', initHistorial)
  </script>
</body>
</html>
